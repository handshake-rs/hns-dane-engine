[workspace]
members = [
    "crates/hns-dane",
    "crates/hns-dane-engine",
    "crates/hns-dane-engine-ffi",
    "crates/hns-dns-wire",
    "crates/hns-dnssec",
    "crates/hns-resolver",
    "crates/hns-resolution-policy",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Denuo-Web/hns-dane-engine"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
alloc_instead_of_core = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
