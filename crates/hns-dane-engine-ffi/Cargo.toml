[package]
name = "hns-dane-engine-ffi"
description = "Versioned C ABI for the runtime-independent HNS DANE engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
documentation = "https://docs.rs/hns-dane-engine-ffi"

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[dependencies]
hns-dane.workspace = true
hns-dane-engine.workspace = true
hns-dns-wire.workspace = true
hns-resolution-policy.workspace = true

[dev-dependencies]
hns-namespace-resolution.workspace = true

[lints.rust]
missing_docs = "warn"
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
