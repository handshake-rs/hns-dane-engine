[package]
name = "hns-browser-loopback-proxy"
description = "Authenticated loopback browser proxy adapters with explicit mobile and Chromium contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file = "../../LICENSE-POLYFORM-NONCOMMERCIAL"
repository.workspace = true
publish = false

[features]
default = ["chromium"]
chromium = []
mobile = []

[dependencies]
base64 = "0.22"
hns-core = { package = "hns-browser-primitives", version = "0.2.0", path = "../hns-browser-primitives" }
hns-dane = { package = "hns-browser-dane", version = "0.2.0", path = "../hns-browser-dane" }
hns-resolver = { package = "hns-browser-resolver", version = "0.2.0", path = "../hns-browser-resolver" }
httparse = "1.10"
idna = "1.1"
rcgen = { version = "0.14.8", default-features = false, features = ["ring", "x509-parser", "zeroize"] }
ring = "0.17.14"
rustls = { version = "0.23.41", default-features = false, features = ["ring", "std", "tls12"] }
subtle = "2"
thiserror = "2"
time = { version = "0.3", default-features = false, features = ["std"] }
zeroize = "1.8"

