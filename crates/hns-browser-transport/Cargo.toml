[package]
name = "hns-browser-transport"
description = "Browser origin transport adapters with explicit mobile and Chromium contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file = "../../LICENSE-POLYFORM-NONCOMMERCIAL"
repository.workspace = true
publish = false

[features]
default = ["chromium"]
chromium = []
mobile = []

[dependencies]
bytes = "1"
h2 = "0.4"
h3 = "0.0.8"
h3-quinn = "0.0.10"
hns-dane = { package = "hns-browser-dane", version = "0.2.0", path = "../hns-browser-dane" }
hns-icann-dane = "=0.1.0"
http = "1"
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23.41", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "net", "rt", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0.8"

[dev-dependencies]
rcgen = { version = "0.14.8", default-features = false, features = ["ring", "x509-parser"] }

