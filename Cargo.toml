[workspace]
members = [
    "crates/hns-dane",
    "crates/hns-dane-engine",
    "crates/hns-dane-engine-ffi",
    "crates/hns-browser-observability",
    "crates/hns-browser-chain",
    "crates/hns-browser-p2p",
    "crates/hns-browser-primitives",
    "crates/hns-browser-runtime",
    "crates/hns-browser-urkel",
    "crates/hns-browser-testkit",
    "crates/hns-cache",
    "crates/hns-dns-wire",
    "crates/hns-dnssec",
    "crates/hns-gateway",
    "crates/hns-icann-dane",
    "crates/hns-light-chain",
    "crates/hns-light-p2p",
    "crates/hns-light-sync",
    "crates/hns-loopback-proxy",
    "crates/hns-namespace-resolution",
    "crates/hns-p2p-transport",
    "crates/hns-resolver",
    "crates/hns-resolution-policy",
    "crates/hns-transport",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/handshake-rs/hns-dane-engine"
publish = ["crates-io"]
keywords = ["handshake", "dane", "dnssec", "browser", "cryptography"]
categories = ["cryptography", "network-programming", "web-programming"]

[workspace.dependencies]
hns-browser-observability = { version = "0.2.0", path = "crates/hns-browser-observability" }
hns-browser-chain = { version = "0.2.0", path = "crates/hns-browser-chain" }
hns-browser-p2p = { version = "0.2.0", path = "crates/hns-browser-p2p" }
hns-browser-primitives = { version = "0.2.0", path = "crates/hns-browser-primitives" }
hns-browser-runtime = { version = "0.2.0", path = "crates/hns-browser-runtime" }
hns-browser-urkel = { version = "0.2.0", path = "crates/hns-browser-urkel" }
hns-cache = { version = "0.2.0", path = "crates/hns-cache" }
hns-covenants = { version = "0.2.0", git = "https://github.com/handshake-rs/hns-rs.git", rev = "29e4b473bd2cfee460b56d5092b7bc28da5ec5dc" }
hns-dane = { version = "0.2.0", path = "crates/hns-dane" }
hns-dane-engine = { version = "0.2.0", path = "crates/hns-dane-engine" }
hns-dane-engine-ffi = { version = "0.2.0", path = "crates/hns-dane-engine-ffi" }
hns-dns-relay-protocol = { version = "0.2.0", git = "https://github.com/handshake-rs/hns-rs.git", rev = "29e4b473bd2cfee460b56d5092b7bc28da5ec5dc" }
hns-dns-wire = { version = "0.2.0", path = "crates/hns-dns-wire" }
hns-dnssec = { version = "0.2.0", path = "crates/hns-dnssec" }
hns-encoding = { version = "0.2.0", git = "https://github.com/handshake-rs/hns-rs.git", rev = "29e4b473bd2cfee460b56d5092b7bc28da5ec5dc" }
hns-gateway = { version = "0.2.0", path = "crates/hns-gateway" }
hns-header-consensus = { version = "0.2.0", git = "https://github.com/handshake-rs/hns-rs.git", rev = "29e4b473bd2cfee460b56d5092b7bc28da5ec5dc" }
hns-hnsr-protocol = { version = "0.2.0", git = "https://github.com/handshake-rs/hns-rs.git", rev = "29e4b473bd2cfee460b56d5092b7bc28da5ec5dc" }
hns-icann-dane = { version = "0.2.0", path = "crates/hns-icann-dane" }
hns-light-chain = { version = "0.2.0", path = "crates/hns-light-chain" }
hns-light-p2p = { version = "0.2.0", path = "crates/hns-light-p2p" }
hns-light-sync = { version = "0.2.0", path = "crates/hns-light-sync" }
hns-loopback-proxy = { version = "0.2.0", path = "crates/hns-loopback-proxy" }
hns-namespace-resolution = { version = "0.2.0", path = "crates/hns-namespace-resolution" }
hns-odoh-protocol = { version = "0.2.0", git = "https://github.com/handshake-rs/hns-rs.git", rev = "29e4b473bd2cfee460b56d5092b7bc28da5ec5dc" }
hns-p2p-experimental = { version = "0.2.0", git = "https://github.com/handshake-rs/hns-rs.git", rev = "29e4b473bd2cfee460b56d5092b7bc28da5ec5dc" }
hns-p2p-transport = { version = "0.2.0", path = "crates/hns-p2p-transport" }
hns-p2p-wire = { version = "0.2.0", git = "https://github.com/handshake-rs/hns-rs.git", rev = "29e4b473bd2cfee460b56d5092b7bc28da5ec5dc" }
hns-primitives = { version = "0.2.0", git = "https://github.com/handshake-rs/hns-rs.git", rev = "29e4b473bd2cfee460b56d5092b7bc28da5ec5dc" }
hns-core = { package = "hns-browser-primitives", version = "0.2.0", path = "crates/hns-browser-primitives" }
hns-chain = { package = "hns-browser-chain", version = "0.2.0", path = "crates/hns-browser-chain" }
hns-urkel = { package = "hns-browser-urkel", version = "0.2.0", path = "crates/hns-browser-urkel" }
hns-resolution-policy = { version = "0.2.0", path = "crates/hns-resolution-policy" }
hns-resolver = { version = "0.2.0", path = "crates/hns-resolver" }
hns-transport = { version = "0.2.0", path = "crates/hns-transport" }
hns-urkel-proof = { version = "0.2.0", git = "https://github.com/handshake-rs/hns-rs.git", rev = "29e4b473bd2cfee460b56d5092b7bc28da5ec5dc" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
alloc_instead_of_core = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
