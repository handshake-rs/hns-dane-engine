[workspace]
members = [
    "crates/hns-dane",
    "crates/hns-dane-engine",
    "crates/hns-dane-engine-ffi",
    "crates/hns-browser-observability",
    "crates/hns-browser-runtime",
    "crates/hns-browser-testkit",
    "crates/hns-cache",
    "crates/hns-dns-wire",
    "crates/hns-dnssec",
    "crates/hns-gateway",
    "crates/hns-icann-dane",
    "crates/hns-light-chain",
    "crates/hns-light-p2p",
    "crates/hns-light-sync",
    "crates/hns-loopback-proxy",
    "crates/hns-namespace-resolution",
    "crates/hns-p2p-transport",
    "crates/hns-resolver",
    "crates/hns-resolution-policy",
    "crates/hns-transport",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/handshake-rs/hns-dane-engine"

[workspace.dependencies]
hns-covenants = { git = "https://github.com/handshake-rs/hns-rs.git", rev = "dde2da81f29df935f043978a6d517c1d60ceff31" }
hns-dns-relay-protocol = { git = "https://github.com/handshake-rs/hns-rs.git", rev = "dde2da81f29df935f043978a6d517c1d60ceff31" }
hns-encoding = { git = "https://github.com/handshake-rs/hns-rs.git", rev = "dde2da81f29df935f043978a6d517c1d60ceff31" }
hns-header-consensus = { git = "https://github.com/handshake-rs/hns-rs.git", rev = "dde2da81f29df935f043978a6d517c1d60ceff31" }
hns-odoh-protocol = { git = "https://github.com/handshake-rs/hns-rs.git", rev = "dde2da81f29df935f043978a6d517c1d60ceff31" }
hns-p2p-experimental = { git = "https://github.com/handshake-rs/hns-rs.git", rev = "dde2da81f29df935f043978a6d517c1d60ceff31" }
hns-p2p-wire = { git = "https://github.com/handshake-rs/hns-rs.git", rev = "dde2da81f29df935f043978a6d517c1d60ceff31" }
hns-primitives = { git = "https://github.com/handshake-rs/hns-rs.git", rev = "dde2da81f29df935f043978a6d517c1d60ceff31" }
hns-urkel-proof = { git = "https://github.com/handshake-rs/hns-rs.git", rev = "dde2da81f29df935f043978a6d517c1d60ceff31" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
alloc_instead_of_core = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
